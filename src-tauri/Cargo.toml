[package]
name = "es-dsl-studio"
version = "1.0.0"
description = "ES DSL Studio - Elasticsearch DSL 查询工作台（桌面版）"
authors = ["ES DSL Studio"]
edition = "2021"
# tauri 2.12 的 MSRV；三平台（Windows / macOS / Linux）统一用 stable 工具链
rust-version = "1.90"

[lib]
name = "es_dsl_studio_lib"
path = "src/lib.rs"

[[bin]]
name = "es-dsl-studio"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-tls：纯 Rust TLS，三平台零系统依赖（Linux 不必装 libssl-dev）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
percent-encoding = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
