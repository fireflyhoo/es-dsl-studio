[package]
name = "es-dsl-studio"
version = "1.0.0"
description = "ES DSL Studio - Elasticsearch DSL 查询工作台（桌面版）"
authors = ["ES DSL Studio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "es_dsl_studio_lib"
path = "src/lib.rs"

[[bin]]
name = "es-dsl-studio"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "default-tls"] }
percent-encoding = "2"
# 调试桥截图用：WebView2 CapturePreview（PrintWindow 对 DirectComposition 窗口会拿到残帧）
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_Foundation"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
